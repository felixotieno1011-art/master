services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: felix
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: snake_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felix -d snake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://felix:secretpassword@db:5432/snake_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
