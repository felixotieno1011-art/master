<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Racer</title>
    <style>
        body { font-family: monospace; background: #222; color: #0f0; text-align: center; margin-top: 20px; }
        canvas { background: #333; border: 2px solid #fff; max-width: 100%; }
        .panel { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #fff; }
        .dpad { display: grid; grid-template-columns: 60px 60px; gap: 10px; justify-content: center; margin-top: 15px; }
        .dpad button { height: 60px; font-size: 24px; }
        input { padding: 10px; margin: 5px; }
        #login-section { margin-bottom: 20px; }
        #leaderboard { text-align: left; display: inline-block; margin-top: 10px; background: #111; padding: 10px; min-width: 200px; }
    </style>
</head>
<body>

    <h2>🏎️ Secure Racer</h2>

    <!-- Login Panel -->
    <div id="login-section">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login / Register</button>
        <p id="auth-status">Not logged in</p>
    </div>

    <!-- Game Panel -->
    <div id="game-section" style="display:none;">
        <h3>Score: <span id="score">0</span></h3>
        <canvas id="gameCanvas" width="300" height="400"></canvas>
        
        <!-- Phone Controls -->
        <div class="dpad">
            <button onclick="moveCar(-1)">⬅️</button>
            <button onclick="moveCar(1)">➡️</button>
        </div>

        <button onclick="submitScore()" style="margin-top: 15px;">Save My Score</button>
    </div>

    <!-- Leaderboard -->
    <div class="panel">
        <div>
            <h3>🏆 Top Racers</h3>
            <div id="leaderboard">Loading...</div>
            <button onclick="fetchLeaderboard()">Refresh</button>
        </div>
    </div>

    <script>
        // --- STATE ---
        let token = null;
        let canvas = document.getElementById("gameCanvas");
        let ctx = canvas.getContext("2d");
        let score = 0;
        
        // Car Game Variables
        let car = { x: 130, y: 320, width: 40, height: 70 };
        let enemies = [];
        let gameLoop;
        let frameCount = 0;
        let speed = 4;

        // --- AUTHENTICATION ---
        async function login() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            const status = document.getElementById("auth-status");

            await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `username=${u}&password=${p}`
            });

            if (res.ok) {
                const data = await res.json();
                token = data.access_token;
                status.innerText = `Logged in as ${u}`;
                document.getElementById("game-section").style.display = "block";
                startGame();
            } else {
                status.innerText = "Login failed";
            }
        }

        // --- GAME LOGIC ---
        function startGame() {
            car = { x: 130, y: 320, width: 40, height: 70 };
            enemies = [];
            score = 0;
            frameCount = 0;
            speed = 4;
            document.getElementById("score").innerText = score;
            clearInterval(gameLoop);
            gameLoop = setInterval(draw, 30); // 30ms = ~33 frames per second
        }

        function moveCar(direction) {
            car.x += direction * 30; // Move left or right by 30 pixels
            // Keep car on screen
            if (car.x < 0) car.x = 0;
            if (car.x > canvas.width - car.width) car.x = canvas.width - car.width;
        }

        // Keyboard support for laptop
        document.addEventListener("keydown", (e) => {
            if(e.key === "ArrowLeft") moveCar(-1);
            if(e.key === "ArrowRight") moveCar(1);
        });

        function draw() {
            // Clear canvas
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw road lines
            ctx.fillStyle = "#fff";
            for (let i = 0; i < canvas.height; i += 40) {
                let offset = (frameCount * speed) % 40;
                ctx.fillRect(145, i + offset, 10, 20);
            }

            // Draw Player Car (Green)
            ctx.fillStyle = "#0f0";
            ctx.fillRect(car.x, car.y, car.width, car.height);

            // Spawn enemies
            frameCount++;
            if (frameCount % 40 === 0) {
                enemies.push({
                    x: Math.floor(Math.random() * 7) * 40 + 10, // Random lane
                    y: -70,
                    width: 40,
                    height: 70
                });
            }

            // Move and draw enemies (Red)
            ctx.fillStyle = "#f00";
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.y += speed;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

                // Check collision
                if (
                    car.x < enemy.x + enemy.width &&
                    car.x + car.width > enemy.x &&
                    car.y < enemy.y + enemy.height &&
                    car.y + car.height > enemy.y
                ) {
                    clearInterval(gameLoop);
                    alert("CRASH! Score: " + score);
                }

                // Remove off-screen enemies & increase score
                if (enemy.y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10;
                    document.getElementById("score").innerText = score;
                }
            }
        }

        // --- API CALLS ---
        async function submitScore() {
            if (!token) return alert("Login first!");
            const res = await fetch('/scores', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({score: score})
            });
            if (res.ok) {
                alert("Score saved!");
                fetchLeaderboard();
            } else {
                alert("Failed to save score.");
            }
        }

        async function fetchLeaderboard() {
            const res = await fetch('/leaderboard');
            const data = await res.json();
            const board = document.getElementById("leaderboard");
            board.innerHTML = data.map((s, i) => `<div>${i+1}. ${s.username}: ${s.score}</div>`).join("");
        }

        fetchLeaderboard();
    </script>
</body>
</html>
