<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Snake</title>
    <style>
        body { font-family: monospace; background: #222; color: #0f0; text-align: center; margin-top: 20px; }
        canvas { background: #000; border: 2px solid #0f0; max-width: 100%; }
        .panel { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #fff; }
        .dpad { display: grid; grid-template-columns: 50px 50px 50px; gap: 5px; justify-content: center; margin-top: 15px; }
        .dpad button { height: 50px; font-size: 20px; }
        input { padding: 10px; margin: 5px; }
        #login-section { margin-bottom: 20px; }
        #leaderboard { text-align: left; display: inline-block; margin-top: 10px; background: #111; padding: 10px; min-width: 200px; }
    </style>
</head>
<body>

    <h2>🐍 Secure Snake</h2>

    <!-- Login Panel -->
    <div id="login-section">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login / Register</button>
        <p id="auth-status">Not logged in</p>
    </div>

    <!-- Game Panel -->
    <div id="game-section" style="display:none;">
        <h3>Score: <span id="score">0</span></h3>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        
        <!-- Phone Controls -->
        <div class="dpad">
            <div></div>
            <button onclick="changeDir(0, -15)">⬆️</button>
            <div></div>
            <button onclick="changeDir(-15, 0)">⬅️</button>
            <button onclick="changeDir(0, 15)">⬇️</button>
            <button onclick="changeDir(15, 0)">➡️</button>
        </div>

        <button onclick="submitScore()" style="margin-top: 15px;">Save My Score</button>
    </div>

    <!-- Leaderboard -->
    <div class="panel">
        <div>
            <h3>🏆 Top Scores</h3>
            <div id="leaderboard">Loading...</div>
            <button onclick="fetchLeaderboard()">Refresh</button>
        </div>
    </div>

    <script>
        // --- STATE ---
        let token = null;
        let canvas = document.getElementById("gameCanvas");
        let ctx = canvas.getContext("2d");
        let score = 0;
        
        // Snake game variables
        let snake = [{x: 150, y: 150}];
        let dx = 15, dy = 0;
        let food = {x: 75, y: 75};
        let gameLoop;

        // --- AUTHENTICATION ---
        async function login() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            const status = document.getElementById("auth-status");

            // 1. Try to register
            await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });

            // 2. Try to login
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `username=${u}&password=${p}`
            });

            if (res.ok) {
                const data = await res.json();
                token = data.access_token;
                status.innerText = `Logged in as ${u}`;
                document.getElementById("game-section").style.display = "block";
                startGame();
            } else {
                status.innerText = "Login failed";
            }
        }

        // --- GAME LOGIC ---
        function startGame() {
            snake = [{x: 150, y: 150}];
            dx = 15; dy = 0; score = 0;
            document.getElementById("score").innerText = score;
            clearInterval(gameLoop);
            gameLoop = setInterval(draw, 150); // Slower for mobile
        }

        function changeDir(newDx, newDy) {
            // Prevent moving backwards directly into itself
            if (newDx !== 0 && dx === 0) { dx = newDx; dy = 0; }
            if (newDy !== 0 && dy === 0) { dx = 0; dy = newDy; }
        }

        document.addEventListener("keydown", (e) => {
            if(e.key === "ArrowUp") changeDir(0, -15);
            if(e.key === "ArrowDown") changeDir(0, 15);
            if(e.key === "ArrowLeft") changeDir(-15, 0);
            if(e.key === "ArrowRight") changeDir(15, 0);
        });

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, 300, 300);

            // Move snake head
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // Check if eating food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                food = {
                    x: Math.floor(Math.random() * 20) * 15,
                    y: Math.floor(Math.random() * 20) * 15
                };
            } else {
                snake.pop(); // Remove tail
            }

            // Draw snake
            ctx.fillStyle = "#0f0";
            snake.forEach(part => ctx.fillRect(part.x, part.y, 14, 14));

            // Draw food
            ctx.fillStyle = "#f00";
            ctx.fillRect(food.x, food.y, 14, 14);

            // Check collision
            if (head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300 || snake.some((p, i) => i !== 0 && p.x === head.x && p.y === head.y)) {
                clearInterval(gameLoop);
                alert("Game Over! Score: " + score);
            }
        }

        // --- API CALLS ---
        async function submitScore() {
            if (!token) return alert("Login first!");
            const res = await fetch('/scores', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({score: score})
            });
            if (res.ok) {
                alert("Score saved!");
                fetchLeaderboard();
            } else {
                alert("Failed to save score.");
            }
        }

        async function fetchLeaderboard() {
            const res = await fetch('/leaderboard');
            const data = await res.json();
            const board = document.getElementById("leaderboard");
            board.innerHTML = data.map((s, i) => `<div>${i+1}. ${s.username}: ${s.score}</div>`).join("");
        }

        fetchLeaderboard();
    </script>
</body>
</html>
