# SPEC: Docker Compose for pos-lab + extras
# 1. app: build from Dockerfile, port 3001
# 2. cache: Redis for speed
# 3. proxy: Nginx for HTTPS
# 4. All services can reach each other by name

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - SECURE_MODE=true
      - REDIS_URL=redis://cache:6379
    volumes:
      - ./db:/app/db
    depends_on:
      - cache

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - app
