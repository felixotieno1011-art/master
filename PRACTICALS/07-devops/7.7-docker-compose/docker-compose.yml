version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: posuser
      POSTGRES_PASSWORD: pospassword
      POSTGRES_DB: posdb
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://posuser:pospassword@db:5432/posdb
      NODE_ENV: production
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
